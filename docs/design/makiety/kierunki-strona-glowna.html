<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yascribe — kierunki stylu (strona główna)</title>
<!-- Makieta: 1 px = 1 pt. Render: Chrome headless, --force-device-scale-factor=2.
     ?k=a|b|c wybiera kierunek; jasny i ciemny obok siebie. -->
<style>
@font-face { font-family: "NY"; src: url("file:///System/Library/Fonts/NewYork.ttf"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 13px/16px system-ui, "SF Pro Text", sans-serif; background: #8a8f98;
       padding: 28px; display: flex; gap: 28px; -webkit-font-smoothing: antialiased; }
.cap { position: absolute; top: 6px; left: 28px; font-size: 11px; color: #fff; opacity: .85; }

/* ---------- okno (wspólne, systemowe) ---------- */
.win { width: 860px; height: 600px; border-radius: 16px; overflow: hidden; position: relative;
       background: var(--bg); color: var(--text); box-shadow: 0 0 0 .5px rgba(0,0,0,.35), 0 18px 50px rgba(0,0,0,.35); }
.lights { position: absolute; top: 18px; left: 20px; display: flex; gap: 8px; z-index: 3; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1){background:#ff5f57} .lights i:nth-child(2){background:#febc2e} .lights i:nth-child(3){background:#28c840}
.side { position: absolute; top: 8px; left: 8px; bottom: 8px; width: 196px; border-radius: 12px;
        background: var(--side); box-shadow: inset 0 0 0 .5px var(--sideEdge); padding: 44px 10px 10px;
        display: flex; flex-direction: column; }
.nav { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 7px; color: var(--text); }
.nav svg { width: 15px; height: 15px; stroke: var(--navIcon); fill: none; stroke-width: 1.4; }
.nav.sel { background: var(--navSel); font-weight: 500; }
.nav.sel svg { stroke: var(--navIconSel); }
.spacer { flex: 1; }
.main { position: absolute; top: 0; left: 212px; right: 0; bottom: 0; overflow: hidden; }
.col { width: 560px; margin: 0 auto; padding-top: 54px; }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.title { font: var(--titleFont); letter-spacing: var(--titleTrack); color: var(--text); }
.search { width: 200px; height: 28px; border-radius: var(--searchR); background: var(--field); box-shadow: inset 0 0 0 .5px var(--fieldEdge);
          display: flex; align-items: center; gap: 6px; padding: 0 10px; color: var(--text3); }
.search svg { width: 13px; height: 13px; stroke: var(--text3); fill: none; stroke-width: 1.6; }

/* karta Record */
.rec { background: var(--card); border-radius: var(--cardR); box-shadow: var(--cardShadow);
       padding: 16px 16px 16px 18px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
.rec h3 { font: var(--cardTitleFont); color: var(--text); margin-bottom: 4px; }
.rec .meta { color: var(--text2); display: flex; align-items: center; gap: 6px; }
.chip { height: 24px; padding: 0 10px; border-radius: var(--chipR); background: var(--chip); box-shadow: inset 0 0 0 .5px var(--chipEdge);
        display: inline-flex; align-items: center; gap: 5px; color: var(--text); font-size: 12px; }
.chip .dim { color: var(--text2); }
.btn-rec { height: 32px; padding: 0 16px 0 13px; border-radius: var(--btnR); background: var(--primary); color: var(--onPrimary);
           display: inline-flex; align-items: center; gap: 7px; font-weight: 600; box-shadow: var(--btnShadow); }
.btn-rec i { width: 9px; height: 9px; border-radius: 50%; background: #ff3b30; display: block; box-shadow: 0 0 0 1.5px var(--recRing); }

/* lista */
.day { font: var(--dayFont); color: var(--text2); letter-spacing: var(--dayTrack); text-transform: var(--dayCase); margin: 0 0 6px 2px; }
.list { background: var(--listBg); border-radius: var(--listR); box-shadow: var(--listShadow); margin-bottom: 20px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: var(--rowPad); position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: var(--sepInset); right: 0; height: .5px; background: var(--sep); }
.ico { width: 30px; height: 30px; border-radius: 8px; background: var(--icoBg); display: grid; place-items: center; flex: none; }
.ico svg { width: 15px; height: 15px; stroke: var(--text2); fill: none; stroke-width: 1.4; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font: var(--rowTitleFont); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t span { display: block; color: var(--text2); font-size: 11px; line-height: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); white-space: nowrap; flex: none;
      height: 22px; padding: 0 9px; border-radius: var(--stR); background: var(--stBg); }
.st svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.st.ok { color: var(--okText); background: var(--okBg); }
.st.live { color: var(--recText); background: var(--recBg); font-weight: 600; font-variant-numeric: tabular-nums; }
.st.live i { width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; display: block; }
.bar { width: 38px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
.bar u { display: block; height: 100%; width: 41%; background: var(--accent); }
.spin { width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid var(--track); border-top-color: var(--accent); }

/* ===================== KIERUNEK A — Native+ ===================== */
.A.light { --bg:#ffffff; --side:rgba(236,236,238,.82); --sideEdge:rgba(0,0,0,.08); --navSel:rgba(0,0,0,.07); --navIcon:#007aff; --navIconSel:#007aff;
  --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6; --field:rgba(0,0,0,.05); --fieldEdge:transparent; --searchR:7px;
  --titleFont:700 26px/32px system-ui; --titleTrack:0; --card:#f5f5f7; --cardR:12px; --cardShadow:none; --cardTitleFont:600 13px/16px system-ui;
  --chip:#fff; --chipEdge:rgba(0,0,0,.12); --chipR:6px; --primary:#007aff; --onPrimary:#fff; --btnR:7px; --btnShadow:none; --recRing:#fff;
  --dayFont:600 11px/14px system-ui; --dayTrack:0; --dayCase:none; --listBg:#f5f5f7; --listR:12px; --listShadow:none; --rowPad:9px 14px;
  --sep:rgba(0,0,0,.1); --sepInset:56px; --icoBg:#fff; --rowTitleFont:500 13px/16px system-ui; --stR:5px; --stBg:transparent;
  --okText:#1d1d1f; --okBg:transparent; --recText:#d70015; --recBg:transparent; --track:rgba(0,0,0,.1); --accent:#007aff; }
.A.dark { --bg:#1e1e1e; --side:rgba(44,44,46,.82); --sideEdge:rgba(255,255,255,.08); --navSel:rgba(255,255,255,.1); --navIcon:#0a84ff; --navIconSel:#0a84ff;
  --text:#f5f5f7; --text2:#98989d; --text3:#636366; --field:rgba(255,255,255,.08); --fieldEdge:transparent; --searchR:7px;
  --titleFont:700 26px/32px system-ui; --titleTrack:0; --card:#2a2a2c; --cardR:12px; --cardShadow:none; --cardTitleFont:600 13px/16px system-ui;
  --chip:#3a3a3c; --chipEdge:rgba(255,255,255,.1); --chipR:6px; --primary:#0a84ff; --onPrimary:#fff; --btnR:7px; --btnShadow:none; --recRing:#fff;
  --dayFont:600 11px/14px system-ui; --dayTrack:0; --dayCase:none; --listBg:#2a2a2c; --listR:12px; --listShadow:none; --rowPad:9px 14px;
  --sep:rgba(255,255,255,.1); --sepInset:56px; --icoBg:#3a3a3c; --rowTitleFont:500 13px/16px system-ui; --stR:5px; --stBg:transparent;
  --okText:#f5f5f7; --okBg:transparent; --recText:#ff453a; --recBg:transparent; --track:rgba(255,255,255,.15); --accent:#0a84ff; }

/* ===================== KIERUNEK B — Ciepły (inne narzędzie) ===================== */
.B.light { --bg:#f7f6f2; --side:rgba(238,236,229,.9); --sideEdge:rgba(60,50,20,.08); --navSel:rgba(60,50,20,.08); --navIcon:#77736a; --navIconSel:#2b2a26;
  --text:#22211e; --text2:#7a766c; --text3:#a8a49a; --field:#fff; --fieldEdge:rgba(60,50,20,.14); --searchR:999px;
  --titleFont:400 30px/36px "NY"; --titleTrack:-.3px; --card:#fff; --cardR:16px; --cardShadow:0 0 0 .5px rgba(60,50,20,.14), 0 1px 2px rgba(60,50,20,.05);
  --cardTitleFont:400 17px/22px "NY"; --chip:#f4f2ec; --chipEdge:rgba(60,50,20,.12); --chipR:999px;
  --primary:#22211e; --onPrimary:#fff; --btnR:999px; --btnShadow:none; --recRing:#22211e;
  --dayFont:500 12px/15px system-ui; --dayTrack:0; --dayCase:none; --listBg:transparent; --listR:0; --listShadow:none; --rowPad:8px 4px;
  --sep:transparent; --sepInset:0; --icoBg:#ecebe5; --rowTitleFont:500 13px/16px system-ui; --stR:999px; --stBg:transparent;
  --okText:#2f6b4f; --okBg:#e6efe8; --recText:#c4271c; --recBg:#fbe9e6; --track:rgba(60,50,20,.12); --accent:#2f6b4f; }
.B.dark { --bg:#1c1c1b; --side:rgba(38,38,36,.9); --sideEdge:rgba(255,255,255,.07); --navSel:rgba(255,255,255,.08); --navIcon:#9a978f; --navIconSel:#efede7;
  --text:#ecebe6; --text2:#9a978f; --text3:#6b6963; --field:#262624; --fieldEdge:rgba(255,255,255,.1); --searchR:999px;
  --titleFont:400 30px/36px "NY"; --titleTrack:-.3px; --card:#262624; --cardR:16px; --cardShadow:0 0 0 .5px rgba(255,255,255,.09);
  --cardTitleFont:400 17px/22px "NY"; --chip:#30302d; --chipEdge:rgba(255,255,255,.08); --chipR:999px;
  --primary:#ecebe6; --onPrimary:#1c1c1b; --btnR:999px; --btnShadow:none; --recRing:#ecebe6;
  --dayFont:500 12px/15px system-ui; --dayTrack:0; --dayCase:none; --listBg:transparent; --listR:0; --listShadow:none; --rowPad:8px 4px;
  --sep:transparent; --sepInset:0; --icoBg:#2b2b29; --rowTitleFont:500 13px/16px system-ui; --stR:999px; --stBg:transparent;
  --okText:#7cc39c; --okBg:rgba(124,195,156,.12); --recText:#ff6b5e; --recBg:rgba(255,107,94,.13); --track:rgba(255,255,255,.12); --accent:#7cc39c; }

/* ===================== KIERUNEK C — Redakcyjny (inne narzędzie) ===================== */
.C.light { --bg:#fdfdfb; --side:rgba(244,243,239,.9); --sideEdge:rgba(0,0,0,.06); --navSel:#fff; --navIcon:#8a877f; --navIconSel:#3b3fd8;
  --text:#141413; --text2:#6f6c66; --text3:#a5a29b; --field:#f3f2ee; --fieldEdge:transparent; --searchR:8px;
  --titleFont:500 36px/40px "NY"; --titleTrack:-.8px; --card:#f3f1ec; --cardR:10px; --cardShadow:none;
  --cardTitleFont:600 15px/20px "NY"; --chip:#fff; --chipEdge:rgba(0,0,0,.1); --chipR:6px;
  --primary:#3b3fd8; --onPrimary:#fff; --btnR:8px; --btnShadow:0 1px 2px rgba(59,63,216,.3); --recRing:#fff;
  --dayFont:600 10px/13px system-ui; --dayTrack:.8px; --dayCase:uppercase; --listBg:transparent; --listR:0; --listShadow:none; --rowPad:11px 2px;
  --sep:rgba(0,0,0,.09); --sepInset:0; --icoBg:transparent; --rowTitleFont:500 14px/18px "NY"; --stR:0; --stBg:transparent;
  --okText:#3b3fd8; --okBg:transparent; --recText:#d4291c; --recBg:transparent; --track:rgba(0,0,0,.1); --accent:#3b3fd8; }
.C.dark { --bg:#161616; --side:rgba(32,32,32,.9); --sideEdge:rgba(255,255,255,.06); --navSel:rgba(255,255,255,.09); --navIcon:#8d8b86; --navIconSel:#9ea2ff;
  --text:#f2f1ee; --text2:#9b9892; --text3:#64625e; --field:#232323; --fieldEdge:transparent; --searchR:8px;
  --titleFont:500 36px/40px "NY"; --titleTrack:-.8px; --card:#212121; --cardR:10px; --cardShadow:none;
  --cardTitleFont:600 15px/20px "NY"; --chip:#2c2c2c; --chipEdge:rgba(255,255,255,.08); --chipR:6px;
  --primary:#7c80ff; --onPrimary:#fff; --btnR:8px; --btnShadow:none; --recRing:#fff;
  --dayFont:600 10px/13px system-ui; --dayTrack:.8px; --dayCase:uppercase; --listBg:transparent; --listR:0; --listShadow:none; --rowPad:11px 2px;
  --sep:rgba(255,255,255,.09); --sepInset:0; --icoBg:transparent; --rowTitleFont:500 14px/18px "NY"; --stR:0; --stBg:transparent;
  --okText:#9ea2ff; --okBg:transparent; --recText:#ff5b4f; --recBg:transparent; --track:rgba(255,255,255,.12); --accent:#9ea2ff; }
.C .ico { display: none; }
</style>
</head>
<body>
<script>
const I = {
  list:'<svg viewBox="0 0 16 16"><path d="M5 4h9M5 8h9M5 12h9"/><circle cx="2" cy="4" r=".6"/><circle cx="2" cy="8" r=".6"/><circle cx="2" cy="12" r=".6"/></svg>',
  sliders:'<svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.6" fill="currentColor"/><circle cx="10" cy="8" r="1.6"/><circle cx="6" cy="12" r="1.6"/></svg>',
  tmpl:'<svg viewBox="0 0 16 16"><rect x="2.5" y="2" width="11" height="12" rx="2"/><path d="M5 5.5h6M5 8h6M5 10.5h3.5"/></svg>',
  gear:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>',
  search:'<svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>',
  doc:'<svg viewBox="0 0 16 16"><path d="M4 1.8h5.5L12.5 5v9.2H4z"/><path d="M6 8h4.5M6 10.5h4.5"/></svg>',
  wave:'<svg viewBox="0 0 16 16"><path d="M2 8v0M4.5 6v4M7 3.5v9M9.5 5.5v5M12 7v2M14 8v0"/></svg>',
  check:'<svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5"/></svg>',
  chev:'<svg viewBox="0 0 16 16" style="width:10px;height:10px"><path d="M4 6l4 4 4-4"/></svg>',
};
function win(k, theme){
  return `<div class="win ${k} ${theme}">
  <div class="lights"><i></i><i></i><i></i></div>
  <div class="side">
    <div class="nav sel">${I.list}Meetings</div>
    <div class="spacer"></div>
    <div class="nav">${I.sliders}Presets</div>
    <div class="nav">${I.tmpl}Templates</div>
    <div class="nav">${I.gear}Settings</div>
  </div>
  <div class="main"><div class="col">
    <div class="head"><div class="title">Meetings</div><div class="search">${I.search}Search meetings</div></div>
    <div class="rec">
      <div><h3>Record a meeting</h3>
        <div class="meta"><span class="chip">Polish <span class="dim">· PL · mai-transcribe-2</span> ${I.chev}</span></div></div>
      <div class="btn-rec"><i></i>Record</div>
    </div>
    <div class="day">Today</div>
    <div class="list">
      <div class="row"><div class="ico">${I.wave}</div><div class="t"><b>Untitled meeting</b><span>14:02 · Polish</span></div><div class="st live"><i></i>Recording 12:04</div></div>
      <div class="row"><div class="ico">${I.doc}</div><div class="t"><b>Scheduling forecast discrepancy with Piotr</b><span>11:29 · 42 min · Polish</span></div><div class="st ok">${I.check}Notes ready</div></div>
      <div class="row"><div class="ico">${I.doc}</div><div class="t"><b>WFM rollout weekly sync</b><span>09:02 · 28 min · English</span></div><div class="st">${I.doc}Transcript ready</div></div>
    </div>
    <div class="day">Yesterday</div>
    <div class="list">
      <div class="row"><div class="ico">${I.doc}</div><div class="t"><b>Untitled meeting</b><span>16:10 · 51 min · Polish</span></div><div class="st"><span class="spin"></span>Correcting…</div></div>
      <div class="row"><div class="ico">${I.doc}</div><div class="t"><b>Untitled meeting</b><span>14:30 · 1 h 05 min · Polish</span></div><div class="st"><span class="bar"><u></u></span>Transcribing 41%</div></div>
    </div>
  </div></div></div>`;
}
const k = (new URLSearchParams(location.search).get('k') || 'a').toUpperCase();
document.body.innerHTML = win(k,'light') + win(k,'dark');
</script>
</body>
</html>

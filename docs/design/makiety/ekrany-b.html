<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yascribe — ekrany, kierunek B</title>
<!-- Makieta wysokiej wierności, kierunek B (ciepły, inne narzędzie), po teście „AI slop" (impeccable operate.md, craft-floor.md).
     1 px = 1 pt; render 2×. ?s=home|meeting|presets|settings|add|pill — jasny i ciemny obok siebie.
     Tokeny = docs/design/macos.md §11. -->
<style>
@font-face { font-family: "NY"; src: url("file:///System/Library/Fonts/NewYork.ttf"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 13px/16px system-ui; background: #8a8f98; padding: 28px; display: flex; gap: 28px; -webkit-font-smoothing: antialiased; }

/* ---------- tokeny §11 ---------- */
.light { --bg:#f7f6f2; --side:#ebe8e0; --sideEdge:rgba(60,50,20,.12); --sel:rgba(60,50,20,.08);
  --card:#ffffff; --sunk:#f1efe9; --line:rgba(60,50,20,.14); --line2:rgba(60,50,20,.08);
  --text:#22211e; --text2:#666259; --text3:#a8a49a; --primary:#22211e; --onPrimary:#ffffff;
  --accent:#2f6b4f; --rec:#c4271c; --warn:#8a5a00; --glass:rgba(250,249,246,.74); --glassEdge:rgba(60,50,20,.16); }
.dark { --bg:#1c1c1b; --side:#151514; --sideEdge:rgba(255,255,255,.08); --sel:rgba(255,255,255,.08);
  --card:#262624; --sunk:#2e2e2c; --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.06);
  --text:#ecebe6; --text2:#9a978f; --text3:#6b6963; --primary:#ecebe6; --onPrimary:#1c1c1b;
  --accent:#7cc39c; --rec:#ff6b5e; --warn:#e0b050; --glass:rgba(36,36,34,.72); --glassEdge:rgba(255,255,255,.12); }

/* ---------- okno i sidebar (systemowe) ---------- */
.win { width: 960px; height: 700px; border-radius: 12px; overflow: hidden; position: relative; flex: none;
       background: var(--bg); color: var(--text); box-shadow: 0 0 0 .5px rgba(0,0,0,.35), 0 18px 50px rgba(0,0,0,.35); }
.lights { position: absolute; top: 18px; left: 20px; display: flex; gap: 8px; z-index: 3; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1){background:#ff5f57} .lights i:nth-child(2){background:#febc2e} .lights i:nth-child(3){background:#28c840}
/* macOS 27: sidebar przy krawędzi okna, ciemniejsze tło, kolorowe ikony */
.side { position: absolute; top: 0; left: 0; bottom: 0; width: 210px; background: var(--side);
        box-shadow: inset -.5px 0 0 var(--sideEdge); padding: 52px 10px 10px; display: flex; flex-direction: column; }
.nav { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 7px; }
.nav.sel { background: var(--sel); font-weight: 500; }
.side .spacer { flex: 1; }
svg { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav svg { width: 15px; height: 15px; color: var(--accent); }
.main { position: absolute; top: 0; left: 210px; right: 0; bottom: 0; overflow: hidden; }
.col { margin: 0 auto; padding-top: 54px; }

/* ---------- typografia: szeryf tylko w tytułach stron i dokumentów ---------- */
.t-large { font: 400 30px/36px "NY"; letter-spacing: -.3px; }
.t-doc   { font: 400 28px/34px "NY"; letter-spacing: -.3px; }
.t-head  { font: 600 13px/16px system-ui; }
.t-cap   { font-size: 11px; line-height: 14px; color: var(--text2); }
.dim { color: var(--text2); } .faint { color: var(--text3); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- komponenty ---------- */
.card { background: var(--card); border-radius: 12px; box-shadow: 0 0 0 .5px var(--line); }
.pill { height: 28px; padding: 0 13px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        background: var(--card); box-shadow: inset 0 0 0 .5px var(--line); font-weight: 500; }
.pill.primary { background: var(--primary); color: var(--onPrimary); box-shadow: none; font-weight: 600; }
.pill.lg { height: 32px; padding: 0 16px; }
.pill.sm { height: 24px; padding: 0 10px; font-size: 12px; }
.pill.off { color: var(--text3); }
.pill svg { width: 13px; height: 13px; }
.state { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; color: var(--text2); }
.state svg { width: 12px; height: 12px; stroke-width: 1.8; }
.state.ok { color: var(--accent); } .state.bad { color: var(--rec); } .state.live { color: var(--rec); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; display: inline-block; flex: none; }
.field { height: 28px; border-radius: 7px; background: var(--card); box-shadow: inset 0 0 0 .5px var(--line);
         display: flex; align-items: center; gap: 6px; padding: 0 10px; min-width: 0; }
.dark .field { background: var(--sunk); }
.field .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field svg { width: 10px; height: 10px; color: var(--text2); }
.field.focus { box-shadow: inset 0 0 0 1px var(--text2), 0 0 0 3px var(--line2); }
.search { border-radius: 999px; color: var(--text3); }
.search svg { width: 13px; height: 13px; color: var(--text3); }
.form-row { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 12px; padding: 10px 16px; position: relative; }
.form-row + .form-row::before, .lrow + .lrow::before { content:""; position:absolute; top:0; left:16px; right:16px; height:.5px; background: var(--line2); }
.form-row label { color: var(--text2); }
.switch { width: 32px; height: 19px; border-radius: 999px; background: var(--accent); position: relative; flex: none; }
.switch::after { content:""; position:absolute; top:2px; right:2px; width:15px; height:15px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); }
.footer { position: absolute; left: 210px; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: flex-end; gap: 8px;
          padding: 0 28px; border-top: .5px solid var(--line2); background: var(--bg); }
.footer .note { margin-right: auto; color: var(--text2); display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; color: var(--text2); }
.icon-btn svg { width: 15px; height: 15px; }
.toolbar { position: absolute; top: 12px; left: 16px; right: 16px; height: 30px; display: flex; align-items: center; gap: 6px; z-index: 2; }
.toolbar .sp { flex: 1; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 22px 0 8px 2px; }
.sec-h .t-head { flex: 1; }
.link { color: var(--text); font-weight: 500; text-decoration: underline; text-decoration-color: var(--text3); text-underline-offset: 2px; }

/* lista spotkań */
.day { font: 500 12px/15px system-ui; color: var(--text2); margin: 0 0 2px 4px; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 4px; position: relative; }
.row + .row::before { content:""; position:absolute; top:0; left:4px; right:4px; height:.5px; background: var(--line2); }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t span { display: block; color: var(--text2); font-size: 11px; line-height: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.bar { width: 38px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar u { display: block; height: 100%; width: 41%; background: var(--text2); }
.spin { width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid var(--line); border-top-color: var(--text2); }

/* widok spotkania */
.tabs { display: flex; gap: 22px; border-bottom: .5px solid var(--line); margin: 18px 0 16px; }
.tab { padding: 0 0 9px; color: var(--text2); font-weight: 500; position: relative; }
.tab.sel { color: var(--text); }
.tab.sel::after { content:""; position:absolute; left:0; right:0; bottom:-.5px; height:2px; border-radius:1px; background: var(--text); }
.genbar { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 8px; border-radius: 10px; background: var(--sunk); margin-bottom: 20px; }
.genbar .ctx { flex: 1; min-width: 0; color: var(--text2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.note { font-size: 14px; line-height: 22px; }
.note p { margin-bottom: 16px; }
.note h4 { font: 600 15px/20px system-ui; margin: 20px 0 6px; }
.note ul { padding-left: 18px; margin: 0; }
.note li { margin-bottom: 3px; }
.note li::marker { color: var(--text3); }
.note .why { color: var(--text2); }

/* presets */
.plist { width: 196px; flex: none; display: flex; flex-direction: column; gap: 2px; }
.prow { padding: 8px 10px; border-radius: 8px; }
.prow b { display: block; font-weight: 500; }
.prow > span { display: block; font-size: 11px; line-height: 14px; color: var(--text2); margin-top: 2px; }
.prow.sel { background: var(--sel); }
.prompt { border-radius: 7px; box-shadow: inset 0 0 0 .5px var(--line); background: var(--card); padding: 8px 10px; line-height: 18px; min-height: 58px; }
.dark .prompt { background: var(--sunk); }

/* settings */
.lrow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; position: relative; }
.lrow .t { flex: 1; min-width: 0; }
.lrow .t b { font-weight: 500; display: block; }
.lrow .t span { font-size: 11px; color: var(--text2); display: block; margin-top: 2px; }
.addrow { display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-top: .5px solid var(--line2); }
.adding { padding: 12px 16px 14px; background: var(--sunk); border-top: .5px solid var(--line2); }
.dark .adding { background: rgba(255,255,255,.03); }
.adding .form-row { padding: 6px 0; grid-template-columns: 70px 1fr; }
.adding .form-row::before { display: none; }

.ptile { width: 32px; height: 32px; border-radius: 8px; background: var(--card); box-shadow: inset 0 0 0 .5px var(--line); flex: none; overflow: hidden; display: grid; place-items: center; color: var(--text2); }
.dark .ptile { background: #2e2e2c; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.18); z-index: 5; }
.dark .scrim { background: rgba(0,0,0,.42); }
.sheet { position: absolute; top: 60px; left: calc(210px + (100% - 210px)/2); transform: translateX(-50%); width: 440px; z-index: 6; border-radius: 14px; background: var(--bg);
         box-shadow: 0 0 0 .5px var(--line), 0 20px 50px rgba(0,0,0,.28); padding: 22px; }
.sheet .form-row { padding: 7px 0; grid-template-columns: 90px 1fr; }
.sheet .form-row::before { display: none; }
/* coming up (2026-10-19) */
.cu-day { display:flex; gap:16px; padding:14px 16px; }
.cu-date { width:64px; flex:none; }
.cu-date b { display:block; font:400 30px/32px "NY"; letter-spacing:-.5px; }
.cu-date span { display:block; font-size:11px; line-height:14px; color:var(--text2); margin-top:2px; }
.cu-list { flex:1; min-width:0; display:flex; flex-direction:column; }
.ev { display:flex; align-items:center; gap:10px; padding:7px 0; position:relative; }
.ev + .ev::before { content:""; position:absolute; top:0; left:0; right:0; height:.5px; background:var(--line2); }
.ev .bar2 { width:3px; align-self:stretch; border-radius:2px; background:var(--line); flex:none; }
.ev .bar2.cal { background:#5b8def; }
.ev .tm { width:86px; flex:none; color:var(--text2); font-size:12px; font-variant-numeric:tabular-nums; }
.ev .t { flex:1; min-width:0; }
.ev .t b { display:block; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ev .t span { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text2); margin-top:1px; }
.ev .t span svg { width:11px; height:11px; }
.ev.soon .tm { color:var(--text); font-weight:600; }
.ev.past { opacity:.55; }
.row.up .t b { color:var(--text); }
.row.up .t span { color:var(--text2); }
.tag { font-size:11px; color:var(--text2); }
/* szablony: sekcje */
.tsec { display: flex; gap: 10px; padding: 12px 14px 12px 8px; position: relative; }
.tsec + .tsec::before { content:""; position:absolute; top:0; left:14px; right:14px; height:.5px; background: var(--line2); }
.grip { width: 14px; flex: none; color: var(--text3); padding-top: 2px; }
.grip svg { width: 12px; height: 14px; }
.tsec .body { flex: 1; min-width: 0; }
.tsec .body b { display: block; font-weight: 600; margin-bottom: 3px; }
.tsec .body > span { display: block; color: var(--text2); line-height: 18px; }
.tsec .rm { color: var(--text3); width: 22px; height: 22px; display: grid; place-items: center; flex: none; }
.tsec .rm svg { width: 11px; height: 11px; }
.tsec.edit { background: var(--sunk); }
.tsec.edit .body b, .tsec.edit .body span { border-radius: 6px; }
.caret { display: inline-block; width: 1px; height: 15px; background: var(--text); vertical-align: -3px; margin-left: 1px; }
.ctxbox { padding: 10px 12px; line-height: 18px; color: var(--text); }
.ctxbox.empty { color: var(--text3); }

/* pigułka */
.desk { width: 960px; height: 700px; border-radius: 16px; overflow: hidden; position: relative; flex: none; color: var(--text);
        background: radial-gradient(1200px 600px at 20% 10%, #6d8fb3, transparent), radial-gradient(900px 600px at 90% 90%, #c08a5a, transparent), #4a5a6a; }
.desk.dark { background: radial-gradient(1200px 600px at 20% 10%, #24364a, transparent), radial-gradient(900px 600px at 90% 90%, #4a3424, transparent), #15191e; }
.teams { position: absolute; left: 60px; top: 40px; width: 840px; height: 290px; border-radius: 14px; background: rgba(40,40,60,.85);
         box-shadow: 0 16px 40px rgba(0,0,0,.35); color: #ddd; padding: 18px 22px; font-size: 12px; }
.teams .tiles2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; height: 220px; }
.teams .tiles2 div { border-radius: 10px; background: rgba(255,255,255,.07); display: grid; place-items: center; color: #aaa; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
         box-shadow: inset 0 0 0 .5px var(--glassEdge), 0 10px 30px rgba(0,0,0,.25); }
.pil { position: absolute; border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 6px; height: 44px; }
.lvl { display: flex; align-items: center; gap: 2px; height: 16px; }
.lvl i { width: 3px; border-radius: 2px; background: var(--text); display: block; }
.stop { height: 32px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 .5px var(--line); color: var(--rec);
        display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.stop i { width: 10px; height: 10px; border-radius: 2px; background: var(--rec); display: block; }
.panel { position: absolute; width: 320px; border-radius: 20px; padding: 14px; }
.meter { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter u { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* dictionary (faza 2.1a) */
.switch.off { background: color-mix(in srgb, var(--text3) 55%, var(--card)); }
.switch.off::after { right: auto; left: 2px; }
.cb { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--text3); display: inline-grid; place-items: center; flex: none; }
.cb.on { background: var(--accent); box-shadow: none; color: var(--card); }
.cb svg { width: 10px; height: 10px; stroke-width: 2.2; }
.state.warn { color: var(--warn); }
.drow .t span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pri { font-size: 12px; color: var(--text2); width: 52px; text-align: right; flex: none; }
.pri.hi { color: var(--text); font-weight: 500; }
.lrow.sel { background: var(--sel); }
.arow { display: grid; grid-template-columns: 1fr 64px 40px; align-items: center; gap: 10px; padding: 6px 14px; position: relative; }
.arow + .arow::before { content:""; position:absolute; top:0; left:14px; right:14px; height:.5px; background: var(--line2); }
.arow.head { padding: 8px 14px 4px; font-size: 11px; color: var(--text2); }
.arow .rk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.arow .field { background: transparent; box-shadow: none; padding: 0; }
.dark .arow .field { background: transparent; }
.sheet.wide { width: 500px; top: 36px; }
.sheet .t-cap b { font-weight: 600; color: var(--text); }
.stat { flex: 1; }
.stat b { display: block; font: 400 26px/30px "NY"; letter-spacing: -.3px; }
.stat span { display: block; font-size: 11px; line-height: 14px; color: var(--text2); margin-top: 2px; }
.ann { position: absolute; font: 500 11px/14px system-ui; color: rgba(255,255,255,.8); }  /* adnotacja makiety, nie UI */
</style>
</head>
<body>
<script>
const I = {
  list:'<svg viewBox="0 0 16 16"><path d="M5 4h9M5 8h9M5 12h9M2 4h.01M2 8h.01M2 12h.01" stroke-width="1.6"/></svg>',
  sliders:'<svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.6" fill="var(--side)"/><circle cx="10" cy="8" r="1.6" fill="var(--side)"/><circle cx="6" cy="12" r="1.6" fill="var(--side)"/></svg>',
  tmpl:'<svg viewBox="0 0 16 16"><rect x="2.5" y="2" width="11" height="12" rx="2"/><path d="M5 5.5h6M5 8h6M5 10.5h3.5"/></svg>',
  gear:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>',
  search:'<svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>',
  check:'<svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5"/></svg>',
  x:'<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  chev:'<svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>',
  up:'<svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg>',
  back:'<svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>',
  copy:'<svg viewBox="0 0 16 16"><rect x="5" y="5" width="8.5" height="8.5" rx="2"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>',
  more:'<svg viewBox="0 0 16 16"><path d="M3.5 8h.01M8 8h.01M12.5 8h.01" stroke-width="2.4"/></svg>',
  redo:'<svg viewBox="0 0 16 16"><path d="M13 3v3.5H9.5"/><path d="M12.6 6.4A5 5 0 1 0 13 10"/></svg>',
  plus:'<svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>',
  speaker:'<svg viewBox="0 0 16 16"><path d="M2.5 6h2.5L8.5 3v10L5 10H2.5z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4"/></svg>',
  book:'<svg viewBox="0 0 16 16"><path d="M3 2.5h8.5A1.5 1.5 0 0 1 13 4v9.5H4.5A1.5 1.5 0 0 1 3 12z"/><path d="M3 12a1.5 1.5 0 0 1 1.5-1.5H13"/></svg>',
  warn:'<svg viewBox="0 0 16 16"><path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.3h.01"/></svg>',
  mic:'<svg viewBox="0 0 16 16"><rect x="5.5" y="1.8" width="5" height="8" rx="2.5"/><path d="M3.5 8a4.5 4.5 0 0 0 9 0M8 12.5v2"/></svg>',
};
const withDict = (new URLSearchParams(location.search).get('s')||'').startsWith('dict');
const sz = (svg, n) => svg.replace('<svg', `<svg style="width:${n}px;height:${n}px"`);
const side = sel => `<div class="side">
  <div class="nav ${sel=='m'?'sel':''}">${I.list}Meetings</div><div class="spacer"></div>
  <div class="nav ${sel=='p'?'sel':''}">${I.sliders}Presets</div>
  <div class="nav ${sel=='t'?'sel':''}">${I.tmpl}Templates</div>
  ${withDict?`<div class="nav ${sel=='d'?'sel':''}">${I.book}Dictionary</div>`:''}
  <div class="nav ${sel=='s'?'sel':''}">${I.gear}Settings</div></div>`;
const win = (th, sel, inner) => `<div class="win ${th}"><div class="lights"><i></i><i></i><i></i></div>${side(sel)}${inner}</div>`;
const popup = (txt, w) => `<div class="field" style="${w?`width:${w}px`:''}"><span class="grow">${txt}</span>${I.chev}</div>`;
const model = (prov, id) => `<div class="field"><span class="dim">${prov}</span><span class="faint">·</span><span class="grow">${id}</span>${I.chev}</div>`;

/* ---------------- strona główna ---------------- */
const row = (title, meta, state) => `<div class="row"><div class="t"><b>${title}</b><span>${meta}</span></div>${state}</div>`;
const home = th => win(th,'m', `<div class="main"><div class="col" style="width:580px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
    <div class="t-large">Meetings</div><div class="field search" style="width:210px">${I.search}Search meetings</div></div>

      <div style="flex:1;min-width:0"><div style="font:400 20px/26px 'NY';margin-bottom:8px">WFM daily standup</div>
        <div style="display:flex;align-items:center;gap:8px">${popup('Polish',140)}<span class="t-cap num">10:00 – 10:30 · 6 attendees</span></div></div>
      <div class="pill primary lg"><span class="dot" style="box-shadow:0 0 0 1.5px var(--primary)"></span>Record</div></div></div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin:0 4px 22px">
    <span class="t-cap">Later today: 11:30 Scheduling forecast review · 14:00 Dentist · 16:00 1:1 Adrian</span>
    <span class="link" style="font-size:12px">Record something else</span></div>
  ${pastRows}
</div></div>`);

/* C: jedna oś dnia — nadchodzące i nagrane razem */
const upRow = (tm, title, sub, right) => `<div class="row up"><span class="num" style="width:44px;flex:none;font-size:12px;color:var(--text2)">${tm}</span><div class="t"><b>${title}</b><span style="display:flex;align-items:center;gap:4px">${sub}</span></div>${right}</div>`;
const cuC = th => win(th,'m', `<div class="main"><div class="col" style="width:580px">${homeHead}
  ${recCard('Record a meeting','PL · microsoft/mai-transcribe-2')}
  <div class="day">Today · Monday 19 October</div>
  ${upRow('16:00','1:1 Adrian',online('Google Meet'),'<span class="tag">Upcoming</span>')}
  ${upRow('14:00','Dentist',inperson,'<span class="tag">Upcoming</span>')}
  ${upRow('11:30','Scheduling forecast review',online('Teams'),'<span class="tag">Upcoming</span>')}
  ${upRow('10:00','WFM daily standup',online('Teams · in 8 min'),`<span class="pill sm">Record</span>`)}
  <div style="display:flex;align-items:center;gap:8px;margin:6px 4px 6px"><span style="flex:1;height:1px;background:var(--text2);opacity:.5"></span><span class="t-cap num">Now 9:52</span></div>
  ${upRow('09:02','WFM rollout weekly sync','28 min · English',`<span class="state ok">${I.check}Notes ready</span>`)}
</div></div>`);

/* stan pusty: kalendarz niepodłączony (wariant A) */
const cuEmpty = th => win(th,'m', `<div class="main"><div class="col" style="width:600px">${homeHead}
  <div class="sec-h" style="margin-top:0"><span class="t-head">Coming up</span></div>
  <div class="card cu-day" style="margin-bottom:22px"><div class="cu-date"><b>19</b><span>October<br>Monday</span></div>
    <div class="cu-list" style="justify-content:center;gap:8px"><div class="dim">See your meetings here and start recording from them.</div>
      <div><span class="pill sm">Connect Apple Calendar…</span></div></div></div>
  ${recCard('Record a meeting','PL · microsoft/mai-transcribe-2')}
  ${pastRows}
</div></div>`);

/* B2: następne spotkanie + stały mały przycisk ad hoc w nagłówku (decyzja 2026-10-19) */
const headAdhoc = (primary) => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:18px">
    <div class="t-large" style="flex:1">Meetings</div><div class="field search" style="width:170px">${I.search}Search</div>
    <div class="field" style="width:96px;height:28px"><span class="grow">Polish</span>${I.chev}</div>
    <div class="pill ${primary?'primary':''}" style="height:28px"><span class="dot" style="width:7px;height:7px;box-shadow:0 0 0 1.5px ${primary?'var(--primary)':'var(--card)'}"></span>Record</div></div>`;
const cuB2 = th => win(th,'m', `<div class="main"><div class="col" style="width:600px">${headAdhoc(false)}
  <div class="card" style="padding:16px;margin-bottom:8px">
    <div class="t-cap" style="margin-bottom:6px">Next · in 8 min · ${sz(I.video,11)} Teams</div>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex:1;min-width:0"><div style="font:400 20px/26px 'NY';margin-bottom:4px">WFM daily standup</div>
        <div class="t-cap num">10:00 – 10:30 · 6 attendees · notes titled and linked to this event</div></div>
      <div class="pill primary lg"><span class="dot" style="box-shadow:0 0 0 1.5px var(--primary)"></span>Record</div></div></div>
  <div style="margin:0 4px 22px" class="t-cap">Later today: 11:30 Scheduling forecast review · 14:00 Dentist (in person) · 16:00 1:1 Adrian</div>
  ${pastRows}
</div></div>`);
const cuB2none = th => win(th,'m', `<div class="main"><div class="col" style="width:600px">${headAdhoc(true)}
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 4px;margin-bottom:14px;border-bottom:.5px solid var(--line2)">
    <span class="dim">No more meetings today.</span><span class="link" style="font-size:12px">Open Calendar</span></div>
  ${pastRows}
</div></div>`);


/* ---------------- Dictionary (faza 2.1a, makieta D11) ---------------- */
const cbox = on => `<span class="cb ${on?'on':''}">${on?I.check:''}</span>`;
const dhead = full => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:18px"><div class="t-large" style="flex:1">Dictionary</div>${full
  ? `<span class="pill">Import…</span><span class="pill">Export…</span><span class="pill">${I.plus}New term</span>` : ''}</div>`;
const drow = (term, pri, aliases, sel) => `<div class="lrow drow ${sel?'sel':''}"><div class="t"><b>${term}</b><span>${aliases}</span></div><span class="pri ${pri=='High'?'hi':''}">${pri}</span></div>`;
const off = a => `${a} <i>(risky, off)</i>`;
const dlist = (selTerm) => `<div class="card" style="overflow:hidden">
  ${drow('Nimbu','High','Rok <i>(risky, off)</i>, Roky, Rokm', selTerm)}
  ${drow('KOPT','High',`ko pt, ${off('Kopt')}`)}
  ${drow('Orbit','High','Orbis, Żorbit')}
  ${drow('OnTrack','High',`on track, ${off('ontrak')}`)}
  ${drow('Dorek','Normal','Dorna')}
  ${drow('Zoom','Normal','Doomem, Zoomem')}
  ${drow('WFM','Normal','<i>No aliases · hint for the model only</i>')}
  ${drow('Terraform','Low','teraform')}
</div>`;
const dbody = (selTerm) => `<div class="main"><div class="col" style="width:640px">
  ${dhead(true)}
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
    <div class="field search" style="width:260px">${I.search}Search terms and aliases</div><span style="flex:1"></span>
    <span class="t-cap num">166 terms · 223 aliases</span></div>
  <div class="genbar" style="margin-bottom:14px"><span class="state warn" style="gap:8px">${sz(I.warn,13)}<span style="color:var(--text);font-size:13px"><b style="font-weight:600">37 terms</b> don’t fit the correction prompt</span></span>
    <span class="ctx" style="text-align:right">gemma-3-4b · context 4096</span></div>
  ${dlist(selTerm)}
</div></div>`;
const dictList = th => win(th,'d', dbody(false));

const dictEmpty = th => win(th,'d', `<div class="main"><div class="col" style="width:640px">
  ${dhead(false)}
  <div class="card" style="padding:22px 24px 24px">
    <div class="t-head" style="font-size:15px;line-height:20px;margin-bottom:6px">No terms yet</div>
    <div class="dim" style="line-height:20px;max-width:520px">Add the names and words your meetings keep getting wrong. A <b style="font-weight:500;color:var(--text)">term</b> is the correct spelling.
      Its <b style="font-weight:500;color:var(--text)">aliases</b> are the wrong spellings the transcript produces; they are replaced automatically, in every meeting.</div>
    <div style="margin:16px 0 20px;padding:12px 14px;border-radius:10px;background:var(--sunk);display:flex;align-items:center;gap:10px">
      <span class="dim">Roky, Rokm</span><span class="faint">→</span><span style="font-weight:600">Nimbu</span></div>
    <div style="display:flex;align-items:center;gap:10px"><span class="pill primary lg">${I.plus}New term</span><span class="pill lg">Import…</span>
      <span class="t-cap">Reads vocab_core.txt and replacements.tsv</span></div>
  </div></div></div>`);

const arow = (a, risky, on) => `<div class="arow"><div class="field"><span class="grow">${a}</span></div>
  <span class="rk">${cbox(risky)}Risky</span><span class="switch ${on?'':'off'}"></span></div>`;
const dictEdit = th => win(th,'d', dbody(true) + `<div class="scrim"></div><div class="sheet wide">
  <div style="margin-bottom:16px"><div class="t-head" style="font-size:15px;line-height:20px">Edit term</div></div>
  <div class="form-row"><label class="dim">Term</label><div class="field"><span class="grow">Nimbu</span></div></div>
  <div class="form-row"><label class="dim">Priority</label><div style="display:flex;align-items:center;gap:10px">${popup('High',120)}<span class="t-cap">Low priority is left out of the prompt first.</span></div></div>
  <div class="sec-h" style="margin:14px 0 6px"><span class="t-head">Aliases</span><span class="t-cap">replaced in every transcript</span></div>
  <div class="card" style="overflow:hidden">
    <div class="arow head"><span>Alias</span><span>Risky</span><span style="text-align:right">On</span></div>
    ${arow('Roky',false,true)}${arow('Rokm',false,true)}${arow('Rok',true,false)}
    <div class="addrow" style="padding:8px 14px;gap:10px"><div class="field ${th=='light'?'focus':''}" style="flex:1;height:28px"><span class="grow ${th=='light'?'faint':''}">${th=='light'?'Add alias':'Zoomem'}${th=='light'?'':'<span class="caret"></span>'}</span></div>
      <span class="pill sm off">Add</span></div>
  </div>
  ${th=='light'
    ? `<div class="t-cap" style="margin:8px 2px 0;line-height:15px"><b>Risky</b> means the alias is also an ordinary word (Rok is a name). It is added switched off; turn it on only if you accept that it may replace correct text.</div>`
    : `<div class="state bad" style="margin:8px 2px 0;white-space:normal;align-items:flex-start">${I.x}<span>“Zoomem” is already an alias of Zoom. An alias belongs to one term.</span></div>`}
  <div style="display:flex;align-items:center;gap:8px;margin-top:20px"><span class="pill sm" style="color:var(--rec)">Delete term</span><span style="flex:1"></span>
    <span class="pill">Cancel</span><span class="pill primary">Save</span></div>
</div>`);

const stat = (n, l) => `<div class="stat"><b class="num">${n}</b><span>${l}</span></div>`;
const cflt = (a, keep, skip) => `<div class="lrow" style="padding:9px 14px"><div class="t"><b style="font-weight:500">“${a}”</b>
  <span style="font-size:12px;line-height:16px">Kept for <strong style="font-weight:600;color:var(--text)">${keep}</strong>, skipped for ${skip}.</span></div></div>`;
const dictImport = th => win(th,'d', dbody(true) + `<div class="scrim"></div><div class="sheet wide">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><span class="state ok" style="font-size:15px">${I.check}</span>
    <div><div class="t-head" style="font-size:15px;line-height:20px">Import finished</div>
    <div class="t-cap" style="margin-top:2px">vocab_core.txt · replacements.tsv</div></div></div>
  <div class="card" style="display:flex;padding:14px 16px">${stat(166,'terms added')}${stat(223,'aliases added')}${stat(12,'risky, left off')}${stat(2,'conflicts')}</div>
  <div class="sec-h" style="margin:16px 0 6px"><span class="t-head">Conflicts</span><span class="t-cap">an alias belongs to one term</span></div>
  <div class="card" style="overflow:hidden">${cflt('Dorna','Dorek','Jarosław')}${cflt('on track','OnTrack','Post Office')}</div>
  <div class="t-cap" style="margin:10px 2px 0;line-height:15px">Risky aliases are switched off. Turn them on one by one in the list. Terms and aliases you already had were left as they are.</div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><span class="pill primary">Done</span></div>
</div>`);

const S = {dictEmpty, dictList, dictEdit, dictImport, home, meeting, presets, settings, add, pill, templates, summary0, transcript, cuA, cuB, cuC, cuEmpty, cuB2, cuB2none};
const s = new URLSearchParams(location.search).get('s') || 'home';
document.body.innerHTML = S[s]('light') + S[s]('dark');
</script>
</body>
</html>
